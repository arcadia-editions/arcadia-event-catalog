version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: '07:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 2
    versioning-strategy: increase
    # Transitive dependencies are pinned by the reviewed lockfile and EventCatalog;
    # Dependabot cannot update them and fails with update_not_possible.
    allow:
      - dependency-type: direct
    groups:
      all-npm:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '07:30'
      timezone: Europe/Madrid
    open-pull-requests-limit: 2
    groups:
      all-actions:
        patterns:
          - '*'

