name: Scheduled dependency audit

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.1'

      - name: Activate the pinned package manager
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Verify the locked dependency graph
        run: |
          pnpm install --frozen-lockfile
          pnpm run verify:security

      # Findings are in EventCatalog's own transitive dependencies, which this
      # repository cannot patch. Report them without failing the schedule, so a
      # red run (and its email) means something actionable broke.
      - name: Report dependency audit
        shell: bash
        run: |
          {
            echo '## pnpm audit'
            echo '```'
            pnpm audit --audit-level moderate || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          pnpm audit --audit-level critical --prod || echo '::warning::critical production vulnerabilities reported; see the job summary'
