minimumReleaseAge: 10080
# TEMPORARY (owner-approved, 2026-11-10): EventCatalog 5.8.0 pins astro@7.3.8, published
# 2026-11-09, whose @astrojs/* dependencies are also younger than seven days.
# Remove this block once everything below is 7 days old (after 2026-11-16).
minimumReleaseAgeExclude:
  - '@eventcatalog/core@5.8.0'
  - 'astro@7.3.8'
  - '@astrojs/*'
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600
blockExoticSubdeps: true
engineStrict: true
nodeVersion: 24.18.1
nodeLinker: hoisted
savePrefix: ''
strictDepBuilds: true
strictPeerDependencies: false
verifyDepsBeforeRun: error
verifyStoreIntegrity: true
strictStorePkgContentCheck: true
overrides:
  # Security fixes for EventCatalog 5.8.0 transitive ranges.
  '@modelcontextprotocol/server': 2.3.1
  'postcss-selector-parser@<6.1.5': 6.1.5
  'glob@>=9.0.0 <14.0.2': 14.0.3
  '@tailwindcss/vite': 4.3.1
  vite: 8.3.5
  rolldown: 1.2.14
allowBuilds:
  '@scarf/scarf': false
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  esbuild: true
  protobufjs: false
  sharp: true
  vue-demi: true
