roducts&quot;],&quot;summary&quot;:[0,&quot;Manages product catalog definitions, release metadata, and publication lifecycle&quot;],&quot;version&quot;:[0,&quot;0.0.1&quot;],&quot;specifications&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;asyncapi&quot;],&quot;path&quot;:[0,&quot;https://github.com/arcadia-editions/catalog-products-api/raw/main/asyncapi.yml&quot;]}],[0,{&quot;type&quot;:[0,&quot;openapi&quot;],&quot;path&quot;:[0,&quot;https://github.com/arcadia-editions/catalog-products-api/raw/main/openapi.yml&quot;]}]]]}],&quot;body&quot;:[0,&quot;## OverviewManages product catalog definitions, release metadata, and publication lifecycle&lt;NodeGraph /&gt;## Message Flow\n\n&lt;MessageTable format=\&quot;all\&quot; limit={8} showChannels={true} /&gt;## Domain Model\n\n&lt;EntityMap /&gt;## Specifications\n\nThe linked specifications in the frontmatter drive EventCatalog reference views for this service.# Product Catalog\n\n## Description\n\nProduct Catalog is the bounded context that defines what Arcadia Editions sells.\nIt owns the commercial identity of each release, including the SKU, description,\npricing, edition size, launch readiness, and publication lifecycle.\n\nIt tells the rest of the platform what exists in the catalog, while leaving stock\nreservation and scarcity control to Catalog Inventory.\n\n## Scope\n\n- Create and maintain product definitions\n- Manage publication and retirement lifecycle\n- Own catalog-facing product attributes such as title, description, price, and launch date\n- Define inventory tracking mode metadata for each release\n\n## Main domain elements\n\n- &amp;#x60;Product&amp;#x60;: aggregate for the commercial definition of a release\n- &amp;#x60;ProductCatalogService&amp;#x60;: commands for creating, updating, publishing, and retiring products\n- &amp;#x60;ProductPublished&amp;#x60;: event announcing a release is available to downstream contexts\n- &amp;#x60;ProductRetired&amp;#x60;: event announcing a release is no longer active in the catalog\n# Catalog Products\n\n## Overview\n\nCatalog Products is the publishing home for the commercial definition of every\nArcadia Editions release. It gives each offering a clear, enduring identity and\nestablishes the information needed for people across the business to understand\nwhat is being presented for sale. The service treats a product as more than a\nlisting: it is the considered expression of an edition&amp;#x27;s title, character,\ncommercial proposition, and place in the catalogue.\n\nThis page describes the business capability represented by Catalog Products. It\nis intended as a durable guide to the service&amp;#x27;s purpose and language, rather\nthan a technical reference. The detailed contracts and artifacts in the\nrepository remain the source for precise integration and delivery information.\n\n## Domain context\n\nCatalog Products sits within the Catalog Management subdomain of the Catalog &amp;amp;\nInventory domain. Catalog Management is concerned with defining the offer that\nArcadia Editions brings to market: the releases it curates, the qualities that\ndistinguish them, and the conditions under which they are presented as part of\nthe active catalogue.\n\nFor a limited-edition business, a product definition provides the stable\ncommercial frame around an edition. It captures the qualities that make a\nrelease recognisable and marketable, while allowing the catalogue to remain\nintentional as collections, seasons, and editorial priorities change. This\nbounded context creates a common business understanding of each release without\nturning the catalogue into a record of operational activity.\n\n## Responsibilities\n\nCatalog Products maintains the authoritative commercial definition of a\nproduct. Its responsibilities include establishing product records, curating the\ncustomer-facing information that explains an offering, and keeping that\ninformation coherent throughout the product&amp;#x27;s catalogue life.\n\nIt manages the progression from an internal product definition to an offering\nthat is suitable for publication, and later to a state in which it is no longer\npresented as active. This includes stewardship of descriptive, pricing,\nedition, and release-oriented information so that product material remains\nmeaningful, accurate, and consistent over time.\n\nThe service also records the inventory-tracking intent associated with a\nrelease. That role is deliberately descriptive: it helps express how an\noffering should be understood in the catalogue without taking ownership of the\nday-to-day accounting of units. In this way, Catalog Products preserves the\nbusiness meaning of an edition while leaving operational concerns in their\nproper place.\n\n## Boundaries\n\nCatalog Products owns the commercial identity and publication lifecycle of a\nrelease. It does not determine the physical availability of copies, make\nallocation decisions, maintain fulfilment activity, or carry out financial\nprocessing. It is also not a content-management system for every possible\neditorial asset; its focus is the product information needed to define and\npresent an offer coherently.\n\nThe boundary keeps catalogue decisions understandable and auditable. Changes to\nhow a product is named, described, positioned, priced, or presented belong here\nwhen they affect the commercial definition. Matters concerned with operational\nexecution, customer interaction, or downstream administration remain outside\nthis service&amp;#x27;s responsibility.\n\n## Business value\n\nBy giving every release a dependable commercial definition, Catalog Products\nhelps Arcadia Editions present a catalogue that is clear, curated, and aligned\nwith its editorial standards. It reduces ambiguity around what an offering is\nand how it should be represented, supporting confident decisions by commercial\nand editorial teams.\n\nThe service also makes change more deliberate. A defined publication lifecycle\nallows the organisation to prepare releases thoughtfully, present them at the\nright moment, and retire them without losing the historical meaning of the\ncatalogue. The result is a more trustworthy product estate: one that can evolve\nwith the collection while keeping each edition&amp;#x27;s commercial story intact.\n2026-05-21\n\n- restructured &amp;#x60;README.md&amp;#x60; so it acts as the repository index\n- added &amp;#x60;SUMMARY.md&amp;#x60; with bounded context description, scope, and main domain elements\n- added this &amp;#x60;CHANGELOG.md&amp;#x60; to track documentation updates\n- added &amp;#x60;EVENT_CATALOG.md&amp;#x60; with the service-level event catalog description&quot;],&quot;filePath&quot;:[0,&quot;../domains/catalog/subdomains/catalog.catalog-management/services/catalog.catalog-management.catalog-products/index.mdx&quot;],&quot;digest&quot;:[0,&quot;9374f5411884be5c&quot;],&quot;deferredRender&quot;:[0,true],&quot;collection&quot;:[0,&quot;services&quot;]}]]],&quot;entities&quot;:[1,[[0,{&quot;id&quot;:[0,&quot;catalog.catalog-management.catalog-products.product-0.0.1&quot;],&quot;data&quot;:[0,{&quot;aggregateRoot&quot;:[0,true],&quot;properties&quot;:[1,[[0,{&quot;name&quot;:[0,&quot;sku&quot;],&quot;type&quot;:[0,&quot;String&quot;],&quot;required&quot;:[0,true]}],[0,{&quot;name&quot;:[0,&quot;name&quot;],&quot;type&quot;:[0,&quot;String&quot;],&quot;required&quot;:[0,true]}],[0,{&quot;name&quot;:[0,&quot;description&quot;],&quot;type&quot;:[0,&quot;String&quot;]}],[0,{&quot;name&quot;:[0,&quot;price&quot;],&quot;type&quot;:[0,&quot;BigDecimal&quot;],&quot;required&quot;:[0,true]}],[0,{&quot;name&quot;:[0,&quot;currency&quot;],&quot;type&quot;:[0,&quot;String&quot;],&quot;required&quot;:[0,true]}],[0,{&quot;name&quot;:[0,&quot;editionSize&quot;],&quot;type&quot;:[0,&quot;Integer&quot;],&quot;required&quot;:[0,true]}],[0,{&quot;name&quot;:[0,&quot;trackingMode&quot;],&quot;type&quot;:[0,&quot;InventoryTrackingMode&quot;],&quot;required&quot;:[0,true],&quot;references& t;Orders Checkout&quot;],&quot;summary&quot;:[0,&quot;Owns checkout flow, order lifecycle, and the handoff from purchase intent to confirmed order&quot;],&quot;version&quot;:[0,&quot;0.0.1&quot;],&quot;specifications&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;asyncapi&quot;],&quot;path&quot;:[0,&quot;https://github.com/arcadia-editions/orders-checkout-api/raw/main/asyncapi.yml&quot;]}],[0,{&quot;type&quot;:[0,&quot;openapi&quot;],&quot;path&quot;:[0,&quot;https://github.com/arcadia-editions/orders-checkout-api/raw/main/openapi.yml&quot;]}]]]}],&quot;body&quot;:[0,&quot;## OverviewOwns checkout flow, order lifecycle, and the handoff from purchase intent to confirmed order&lt;NodeGraph /&gt;## Message Flow\n\n&lt;MessageTable format=\&quot;all\&quot; limit={8} showChannels={true} /&gt;## Domain Model\n\n&lt;EntityMap /&gt;## Specifications\n\nThe linked specifications in the frontmatter drive EventCatalog reference views for this service.# Orders Checkout\n\n## Description\n\nOrders Checkout is the bounded context that owns the commercial commitment to\nbuy. It starts the checkout, reacts to stock and payment outcomes, and decides\nwhether the order is created, confirmed, or cancelled.\n\nIt is the service that marks the transition from customer purchase intent into a\nreal order that other operational contexts can act on.\n\n## Scope\n\n- Start customer checkout for selected items\n- Own the order lifecycle from creation to confirmation or cancellation\n- Publish the pivotal &amp;#x60;OrderConfirmed&amp;#x60; event that shifts the flow into operations\n- React to stock and payment outcomes without owning payment or inventory rules\n\n## Main domain elements\n\n- &amp;#x60;Order&amp;#x60;: aggregate for the checkout commitment\n- &amp;#x60;OrdersCheckoutService&amp;#x60;: commands for starting checkout, confirming, and cancelling orders\n- &amp;#x60;OrderCreated&amp;#x60;: event announcing that checkout successfully created an order\n- &amp;#x60;OrderConfirmed&amp;#x60;: event that hands the flow off to downstream operational contexts\n- &amp;#x60;OrderCancelled&amp;#x60;: event announcing the commercial flow could not complete\n- &amp;#x60;StockUnavailable&amp;#x60;: commercial outcome when checkout cannot secure scarce stock\n# Orders Checkout\n\n## Overview\n\nOrders Checkout describes the business facts produced as a customer moves from an intention to purchase to a durable commercial commitment. It is the Arcadia Editions bounded context that turns a proposed purchase into an order that can be recognized, managed, and acted on with confidence. This catalog explains the meaningful checkout outcomes in business terms, giving product, operations, support, and engineering teams a shared vocabulary without requiring knowledge of the implementation behind them.\n\n## Domain context\n\nThe Orders domain covers the commercial lifecycle of an order: its creation, confirmation, and cancellation. Checkout owns the earliest decisive stage, when customer purchase intent becomes a formal order commitment. It provides a clear boundary between a shopping decision and an order that has entered the business lifecycle.\n\nAn order in this context is a commercial promise with an identity and lifecycle. The context keeps that promise understandable by expressing progress through meaningful business states rather than incidental processing activity. A successful progression establishes that the order can move forward as a valid commitment. An unsuccessful progression records that the commitment could not be completed, allowing teams to distinguish a concluded attempt from an active order.\n\n## Responsibilities\n\nOrders Checkout owns the decision-making and recordkeeping needed to create, confirm, or cancel an order during checkout. It establishes the order as a commercial entity, maintains its lifecycle while checkout is underway, and communicates material outcomes in language that business users can interpret consistently.\n\nThe context represents a checkout attempt as a coherent whole. It makes the resulting order status explicit, providing a stable answer to essential questions: has an order been created, is its commitment confirmed, or has the checkout been cancelled? It also preserves the significance of these outcomes over time. A confirmation is a business milestone, not merely a technical success, and a cancellation is a definitive commercial result rather than an ambiguous absence of progress.\n\n## Boundaries\n\nOrders Checkout does not define product information, maintain stock positions, perform financial-provider work, arrange shipment, or communicate with customers. Its role is to own the commercial decision and lifecycle of the order during checkout, not the specialist processes that may inform that decision.\n\nThe service also does not expose internal processing mechanics as business meaning. Temporary checks, operational retries, implementation choices, and transport details are deliberately absent from this catalog. This keeps the published description durable as the service evolves and lets readers rely on the business intent of its outcomes instead of incidental design details.\n\n## Business value\n\nBy giving checkout a clear owner and a concise set of durable outcomes, Orders Checkout reduces ambiguity around a pivotal moment in the customer experience. Teams can align on the difference between interest in a purchase, an established order, a confirmed commitment, and a cancelled attempt. This shared understanding improves customer support, operational reporting, product analysis, and governance because each can reason from the same commercial language.\n\nThe catalog provides a stable, human-readable reference for the business meaning of checkout outcomes while allowing the underlying service to evolve independently. In doing so, Orders Checkout helps Arcadia Editions maintain reliable order records, make the customer journey easier to explain, and preserve trust in the commercial commitments represented by its platform.\n2026-05-21\n\n- rewrote &amp;#x60;README.md&amp;#x60; to explain Orders Checkout as a bounded context\n- added &amp;#x60;SUMMARY.md&amp;#x60; with the business-purpose summary for event catalog generation\n- added this &amp;#x60;CHANGE.log&amp;#x60; to track documentation updates\n- added &amp;#x60;EVENT_CATALOG.md&amp;#x60; with an evergreen description of Orders Checkout for event catalog publication&quot;],&quot;filePath&quot;:[0,&quot;../domains/orders/subdomains/orders.checkout/services/orders.checkout.orders-checkout/index.mdx&quot;],&quot;digest&quot;:[0,&quot;e139371ba37df82e&quot;],&quot;deferredRender&quot;:[0,true],&quot;collection&quot;:[0,&quot;services&quot;]}]]],&quot;entities&quot;:[1,[[0,{&quot;id&quot;:[0,&quot;orders.checkout.orders-checkout.order-0.0.1&quot;],&quot;data&quot;:[0,{&quot;aggregateRoot&quot;:[0,true],&quot;identifier&quot;:[0,&quot;orderId&quot;],&quot;properties&quot;:[1,[[0,{&quot;name&quot;:[0,&quot;orderId&quot;],&quot;type&quot;:[0,&quot;String&quot;],&quot;required&quot;:[0,true]}],[0,{&quot;name&quot;:[0,&quot;status&quot;],&quot;type&quot;:[0,&quot;OrderStatus&quot;],&quot;required&quot;:[0,true],&quot;references&quot;:[0,&quot;OrderStatus&quot;],&quot;enum&quot;:[1,[[0,&quot;CREATED&quot;],[0,&quot;CONFIRMED&quot;],[0,&quot;CANCELLED&quot;]]]}],[0,{&quot;name&quot;:[0,&quot;items&quot;],&quot;type&quot;:[0,&quot;String&quot;],&quot;required&quot;:[0,true]}],[0,{&quot;name&quot;:[0,&quot;createdAt&quot;],&quot;type&quot;:[0,&quot;Instant&quot;]}],[0,{&quot;name&quot;:[0,&quot;confirmedAt&quot;],&quot;type&quot;:[0,&quot;Instant&quot;]}],[0,{&quot;name&quot;:[0,&quot;cancelledAt&quot;],&quot;type&quot;:[0,&quot;Instant&quot;]}]]],&quot;services&quot;:[1,[[0,{&quot;id&quot;:[0,&quot;orders.checkout.orders-checkout-0.0.1&quot;],&quot;collection&quot;:[0,&quot;services&quot;]}]]],&quot;domains&quot;:[1,[[0,{&quot;id&quot;:[0,&quot;orders.checkout-0.0.1&quot;],&quot;collection&quot;:[0,&qu ons-consumer.notification&quot;],&quot;version&quot;:[0,&quot;0.0.1&quot;]}]]],&quot;id&quot;:[0,&quot;notifications.customer-communications.notifications-consumer&quot;],&quot;name&quot;:[0,&quot;Notifications Consumer&quot;],&quot;summary&quot;:[0,&quot;Transforms business outcomes into customer-facing notifications and delivery results&quot;],&quot;version&quot;:[0,&quot;0.0.1&quot;],&quot;specifications&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;asyncapi&quot;],&quot;path&quot;:[0,&quot;https://github.com/arcadia-editions/notifications-consumer-api/raw/main/asyncapi.yml&quot;]}],[0,{&quot;type&quot;:[0,&quot;openapi&quot;],&quot;path&quot;:[0,&quot;https://github.com/arcadia-editions/notifications-consumer-api/raw/main/openapi.yml&quot;]}]]]}],&quot;body&quot;:[0,&quot;## OverviewTransforms business outcomes into customer-facing notifications and delivery results&lt;NodeGraph /&gt;## Message Flow\n\n&lt;MessageTable format=\&quot;all\&quot; limit={8} showChannels={true} /&gt;## Domain Model\n\n&lt;EntityMap /&gt;## Specifications\n\nThe linked specifications in the frontmatter drive EventCatalog reference views for this service.# Notifications Consumer\n\n## Description\n\nNotifications Consumer is the bounded context that turns domain events into\ncustomer communications. It reacts to outcomes produced by the core services and\ndecides what message should be sent, through which channel, and to whom.\n\nIt is a supporting service focused on communication rather than ownership of the\ncore commerce process itself.\n\n## Scope\n\n- Send order confirmation messages after successful payment capture\n- Notify customers when scarce stock is unavailable\n- Notify customers when orders are cancelled\n- Track delivery success or failure for outbound communications\n\n## Main domain elements\n\n- &amp;#x60;Notification&amp;#x60;: aggregate for outbound communication attempts\n- &amp;#x60;NotificationsConsumerService&amp;#x60;: event-driven commands for customer messaging\n- &amp;#x60;OrderConfirmationSent&amp;#x60;: event announcing a successful order confirmation message\n- &amp;#x60;StockUnavailableNotificationSent&amp;#x60;: event announcing a successful stock-unavailable message\n- &amp;#x60;OrderCancelledNotificationSent&amp;#x60;: event announcing a successful order-cancelled message\n- &amp;#x60;NotificationDeliveryFailed&amp;#x60;: failure outcome for downstream monitoring or recovery\n# Notifications Consumer\n\n## Overview\n\nNotifications Consumer provides the customer-communications perspective within Arcadia Editions. Its purpose is to translate meaningful business outcomes into clear, appropriate communications for customers. The service manages the business intent and delivery status of those communications, giving customer messaging a defined place in the overall product experience rather than treating it as an incidental side effect.\n\nThis catalog page describes the enduring business role of the service and the meaning of the outcomes it publishes. It is written for product, service, and operations stakeholders who need to understand the customer-communication capability at a stable level. Detailed message contracts, schemas, and other implementation artifacts remain the authoritative source for technical specifics; this page deliberately focuses on the business purpose behind them.\n\nNotifications Consumer treats each communication as a managed interaction. It supports a consistent account of why a customer should be contacted, how the notification is prepared for delivery, and whether the attempt has reached a conclusive outcome. This allows customer communications to be understood as a reliable domain capability with its own lifecycle, accountability, and operational significance.\n\n## Domain context\n\nThe Notifications domain is responsible for customer communication prompted by meaningful business outcomes. Its Customer Communications subdomain is focused on transforming those outcomes into messages that are relevant, understandable, and suitable for delivery. The emphasis is on communicating with customers clearly and responsibly, while retaining a business record of the result of each communication effort.\n\nCustomer communication is more than the composition of a message. It includes recognizing when a customer-facing response is warranted, identifying the intended audience and channel in business terms, and determining whether delivery succeeded or needs further attention. Notifications Consumer provides this focused capability without taking ownership of the business decisions that gave rise to the communication.\n\n## Responsibilities\n\nNotifications Consumer owns the lifecycle of outbound customer communication. It turns eligible business outcomes into notification work, records the purpose and intended recipient of that work, and represents the outcome of delivery. The service supports common customer-facing situations, including confirmations, important availability updates, and changes that require a timely customer response.\n\nThe service makes successful communication and unsuccessful delivery distinct business outcomes. This gives teams a dependable way to reason about whether customers have been informed and whether a communication attempt requires attention. It also preserves a coherent history of notification activity that can support service quality, customer care, and operational follow-up.\n\n## Boundaries\n\nNotifications Consumer is bounded by customer-facing communication and the result of attempting delivery. It does not own order decisions, product availability, financial processing, fulfillment execution, or the underlying business facts communicated to customers. It does not define a particular messaging vendor, template system, delivery protocol, or user-interface experience.\n\nThe service is also not a general-purpose marketing platform. Its focus is purposeful communication arising from business outcomes that matter to a customer. By keeping that boundary explicit, the service avoids mixing transactional communication with broader campaign management and retains a clear responsibility for reliable, relevant customer notification.\n\n## Business value\n\nBy giving customer communications a dedicated business capability, Notifications Consumer helps Arcadia Editions provide timely and consistent information when it matters most. Customers benefit from messages that acknowledge significant changes or confirmations, while teams gain a clear view of whether communication efforts have achieved their intended result.\n\nThe service makes communication outcomes visible and manageable without binding the business model to a specific delivery mechanism. This supports dependable customer care, clearer operational oversight, and an adaptable foundation for future communication needs. Its catalog preserves the stable language of customer notification as channels, policies, and technical artifacts evolve.\n2026-05-21\n\n- added &amp;#x60;README.md&amp;#x60; describing Notifications Consumer as a bounded context\n- added &amp;#x60;SUMMARY.md&amp;#x60; with the business-purpose summary for event catalog generation\n- added this &amp;#x60;CHANGE.log&amp;#x60; to track documentation updates\n- added &amp;#x60;EVENT_CATALOG.md&amp;#x60; with publication-ready Notifications Consumer catalog content&quot;],&quot;filePath&quot;:[0,&quot;../domains/notifications/subdomains/notifications.customer-communications/services/notifications.customer-communications.notifications-consumer/index.mdx&quot;],&quot;digest&quot;:[0,&quot;36fb1cb9d15e500b&quot;],&quot;deferredRender&quot;:[0,true],&quot;collection&quot;:[0,&quot;services&quot;]}]]],&quot;entities&quot;:[1,[[0,{&quot;id&quot;:[0,&quot;notifications.customer-communications.notifications-consumer.notification-0.0.1&quot;],&quot;data&quot;:[0,{&quot;aggregateRoot&quot;:[0,true],&quot;identifier&quot;:[0,&quot;notificationId&quot;],&quot;properties&quot;:[1,[[0,{&quot;name&q pi&quot;],&quot;path&quot;:[0,&quot;https://github.com/arcadia-editions/catalog-inventory-api/raw/main/asyncapi.yml&quot;]}],[0,{&quot;type&quot;:[0,&quot;openapi&quot;],&quot;path&quot;:[0,&quot;https://github.com/arcadia-editions/catalog-inventory-api/raw/main/openapi.yml&quot;]}]]]}],&quot;body&quot;:[0,&quot;## OverviewOwns scarce stock reservation, stock release, and inventory position management&lt;NodeGraph /&gt;## Message Flow\n\n&lt;MessageTable format=\&quot;all\&quot; limit={8} showChannels={true} /&gt;## Domain Model\n\n&lt;EntityMap /&gt;## Specifications\n\nThe linked specifications in the frontmatter drive EventCatalog reference views for this service.# Catalog Inventory\n\n## Description\n\nCatalog Inventory is the bounded context that owns scarce stock in Arcadia\nEditions. It protects edition availability by deciding whether a customer can\nclaim a copy, holding that copy during checkout, and releasing it when the order\ndoes not complete.\n\nIt also supports backoffice inventory operations by tracking how much stock is\navailable, reserved, sold, received, or adjusted for each SKU.\n\n## Scope\n\n- Reserve stock for an order during checkout\n- Release reserved stock when payment or scheduling fails\n- Track reservation lifecycle and release reasons\n- Maintain inventory positions for available, reserved, and sold quantities\n- Support stock intake and manual stock adjustments in backoffice flows\n\n## Main domain elements\n\n- &amp;#x60;StockReservation&amp;#x60;: aggregate for scarce inventory claims made during checkout\n- &amp;#x60;InventoryPosition&amp;#x60;: aggregate for backoffice inventory balances per SKU\n- &amp;#x60;InventoryService&amp;#x60;: reservation API and event-driven release handling\n- &amp;#x60;InventoryBackofficeService&amp;#x60;: stock intake and adjustment operations\n# Catalog Inventory\n\n## Overview\n\nCatalog Inventory is the stewardship capability for the scarce, physical side\nof Arcadia Editions releases. It maintains a reliable business view of the\ncopies associated with an offering and protects the integrity of limited-edition\navailability. Its purpose is to ensure that stock is represented thoughtfully\nthroughout its operational life, from being brought into the estate to being set\naside, released, sold, or corrected.\n\nThis page explains the enduring business role of Catalog Inventory. It is a\npublication-oriented description, not a substitute for the repository&amp;#x27;s formal\nartifacts. Those artifacts provide the detailed information needed by teams\nworking with the service, while this page focuses on the language, scope, and\nvalue of the capability itself.\n\n## Domain context\n\nCatalog Inventory belongs to the Inventory Management subdomain of the Catalog\n&amp;amp; Inventory domain. Inventory Management addresses the controlled availability\nof editions whose quantity matters to the business and to collectors. In this\ncontext, each unit carries commercial significance: availability must be\nrepresented with care so that the catalogue remains credible and the promise of\na limited release is respected.\n\nThe subdomain distinguishes the commercial definition of a release from the\noperational position of its copies. Catalog Inventory concentrates on the latter.\nIt provides the disciplined view required to understand whether units are\navailable for use, temporarily committed, no longer available, or in need of\nbackoffice attention. This creates a stable vocabulary for inventory decisions\nwithout conflating them with the wider presentation of the catalogue.\n\n## Responsibilities\n\nCatalog Inventory maintains inventory positions for catalogue items and manages\nthe lifecycle of scarce stock claims. It records the business effects of stock\nbeing received, adjusted, reserved, released, and sold so that the current\nposition is meaningful and traceable. It also supports the careful handling of\ntemporary commitments, ensuring that a copy can be held when appropriate and\nmade available again when that commitment no longer applies.\n\nThe service supports backoffice stewardship as well as controlled allocation.\nInventory teams can use its concepts to reflect stock intake and corrections,\nkeeping the recorded position aligned with the physical reality of an edition.\nIts responsibilities are designed around consistency: an edition&amp;#x27;s scarcity\nshould be understood from a single authoritative operational perspective.\n\n## Boundaries\n\nCatalog Inventory owns stock positions and the business rules around reserving\nand releasing scarce copies. It does not define the commercial identity,\neditorial description, pricing, or publication status of a product. Nor does it\nown payment decisions, customer communications, transport activity, or the\nphysical warehouse processes used to carry out a stock movement.\n\nThe service is also not a general asset register. Its boundary is the inventory\nmeaning required for catalogue releases: quantities, commitments, and the\noperational status of available copies. Keeping this focus prevents accounting\nof scarcity from being diluted by concerns that belong to other business\ncapabilities.\n\n## Business value\n\nCatalog Inventory protects confidence in Arcadia Editions&amp;#x27; limited releases. A\nclear and authoritative view of stock helps the organisation uphold the value of\nscarcity, make responsible commitments, and avoid presenting availability that\ncannot be honoured. It gives backoffice teams a dependable basis for managing\nexceptions and maintaining an accurate picture of the estate.\n\nBy separating inventory stewardship from catalogue definition, the service also\nmakes change easier to reason about. Teams can improve stock practices without\naltering the commercial story of a release, while catalogue work can remain\nfocused on the offer itself. The result is a more resilient operational\nfoundation for a curated, limited-edition business.\n2026-05-21\n\n fications in the frontmatter drive EventCatalog reference views for this service.# Payments Processing\n\n## Description\n\nPayments Processing is the bounded context that owns the money side of an\nArcadia Editions order. It handles authorization, retries, capture, voiding, and\nthe integration details required to work with external payment providers.\n\nIt gives the rest of the platform trustworthy payment outcomes without owning the\norder, stock, or shipping domains.\n\n## Scope\n\n- Authorize payment when an order is created\n- Retry failed payment attempts when policy allows it\n- Capture payment once fulfillment has been scheduled\n- Void payment when fulfillment fails or capture cannot complete\n- Own provider references, failure reasons, and payment attempt tracking\n\n## Main domain elements\n\n- &amp;#x60;Payment&amp;#x60;: aggregate for provider interaction and payment state\n- &amp;#x60;PaymentsProcessingService&amp;#x60;: commands for authorization, retry, capture, and void\n- &amp;#x60;PaymentAuthorized&amp;#x60;: event announcing successful authorization\n- &amp;#x60;PaymentDeclined&amp;#x60;: event announcing a provider rejection\n- &amp;#x60;PaymentFailed&amp;#x60;: event announcing a technical or operational authorization failure\n- &amp;#x60;PaymentCaptured&amp;#x60;: event announcing funds were captured successfully\n- &amp;#x60;PaymentCaptureFailed&amp;#x60;: event announcing capture did not complete\n- &amp;#x60;PaymentVoided&amp;#x60;: event announcing the payment was compensated\n# Payments Processing\n\n## Overview\n\nPayments Processing describes the business facts that explain how a payment moves through its commercial lifecycle. It is the Arcadia Editions bounded context that establishes, manages, completes, or compensates a financial commitment associated with a purchase. This catalog provides a durable explanation of meaningful payment outcomes that business and technical audiences can use without relying on provider-specific or implementation-specific knowledge.\n\nPayments are consequential business records. They communicate whether a financial commitment can proceed, whether it needs further attention, whether funds have been completed, or whether an earlier commitment has been reversed. This context turns those changes into clear, interpretable outcomes. Its purpose is not to describe payment mechanics, but to make the business significance of a payment lifecycle visible and dependable.\n\n## Domain context\n\nThe Payments domain governs the financial side of a purchase. Its Payment Processing subdomain owns the lifecycle of a payment from the point it is considered for authorization through completion or reversal. It is the authoritative place for describing the status of a payment commitment and the business outcomes that alter that status.\n\nA payment is a lifecycle entity, not a single moment. It can progress through stages that reflect increasing commercial certainty, or reach outcomes that prevent or undo that progression. The context makes these transitions understandable through a stable vocabulary. Readers can reason about whether a payment is ready to proceed, needs another attempt, has been completed, or has been compensated, without conflating those meanings.\n\n## Responsibilities\n\nPayments Processing owns the business record of payment authorization, retry, capture, voiding, and their outcomes. It maintains a payment&amp;#x27;s lifecycle and communicates material changes in a way that preserves their financial meaning. This includes distinguishing an ordinary decision not to authorize a payment from an operational failure, and distinguishing successful completion from a later reversal.\n\nThe context owns continuity of a payment across its lifecycle. A payment remains recognizable as the same commercial commitment while its status changes, enabling teams to understand its history and current significance. It records whether the commitment is authorized, whether an attempt has not succeeded, whether funds have been captured, and whether a previous state has been compensated. These outcomes are durable business facts suitable for consistent interpretation over time.\n\n## Boundaries\n\nPayments Processing does not own the commercial order, catalog information, inventory position, shipping activity, or customer communication. It also does not represent internal behavior of external financial providers as a public business model. Its scope is the payment commitment and the business consequences of its lifecycle.\n\nProvider protocols, implementation approaches, transient processing steps, and detailed retry mechanics are intentionally outside this catalog. They may change as the service evolves, but they do not change the durable meanings of authorization, decline, failure, capture, or voiding. Keeping those details separate makes the catalog useful to a broad audience and protects its value as a long-lived description of payment outcomes.\n\n## Business value\n\nClear payment outcomes enable Arcadia Editions to treat financial activity as an understandable and auditable part of the customer experience. Teams can distinguish decisions, failures, completions, and compensations with confidence, improving communication with customers and supporting sound operational and financial reporting. The lifecycle perspective also reduces ambiguity when investigating payment status or measuring business performance.\n\nThis catalog is a stable reference that can outlast changes in vendors, delivery mechanisms, and internal implementation. It makes the payment context easier to govern, explain, and evolve responsibly. By preserving the business meaning of payment lifecycle changes, Payments Processing helps protect trust, support accurate financial understanding, and maintain consistency across the platform.\n2026-05-21\n\n- added &amp;#x60;README.md&amp;#x60; describing Payments Processing as a bounded context\n- added &amp;#x60;SUMMARY.md&amp;#x60; with the business-purpose summary for event catalog generation\n- added this &amp;#x60;CHANGE.log&amp;#x60; to track documentation updates\n- added &amp;#x60;EVENT_CATALOG.md&amp;#x60; with an evergreen description of Payments Processing for event catalog publication&quot;],&quot;filePath&quot;:[0,&quot;../domains/payments/subdomains/payments.payment-processing/services/payments.payment-processing.payments-processing/index.mdx&quot;],&quot;digest&quot;:[0,&quot;ec9eefea72fbfe36&quot;],&quot;deferredRender&quot;:[0,true],&quot;collection&quot;:[0,&quot;services&quot;]}]]],&quot;entities&quot;:[1,[[0,{&quot;id&quot;:[0,&quot;payments.payment-processing.payments-processing.payment-0.0.1&quot;],&quot;data&quot;:[0,{&quot;aggregateRoot&quot;:[0,true],&quot;identifier&quot;:[0,&quot;paymentId&quot;],&quot;properties&quot;:[1,[[0,{&quot;name&quot;:[0,&quot;paymentId&quot;],&quot;type&quot;:[0,&quot;String&quot;],&quot;required&quot;:[0,true]}],[0,{&quot;name&quot;:[0,&quot;orderId&quot;],&quot;type&quot;:[0,&quot;String&quot;],&quot;required&quot;:[0,true]}],[0,{&quot;name&quot;:[0,&quot;customerId&quot;],&quot;type&quot;:[0,&quot;String&quot;],&quot;required&quot;:[0,true]}],[0,{&quot;name&quot;:[0,&quot;amount&quot;],&quot;type&quot;:[0,&quot;BigDecimal&quot;],&quot;required&quot;:[0,true]}],[0,{&quot;name&quot;:[0,&quot;currency&quot;],&quot;type&quot;:[0,&quot;String&quot;],&quot;required&quot;:[0,true]}],[0,{&quot;name&quot;:[0,&quot;status&quot;],&quot;type&quot;:[0,&quot;PaymentStatus&quot;],&quot;required&quot;:[0,true],&quot;references&quot;:[0,&quot;PaymentStatus&quot;],&quot;enum&quot;:[1,[[0,&quot;AUTHORIZATION_REQUESTED&quot;],[0,&quot;AUTHORIZED&quot;],[0,&quot;DECLINED&quot;],[0,&quot;FAILED&quot;],[0,&quot;RETRY_EXHAUSTED&quot;],[0,&quot;CAPTURED&quot;],[0,&quot;VOIDED&quot;]]]}],[0,{&quot;name&quot;:[0,&quot;providerReference&quot;],&quot;type&quot;:[0,&quot;String&quot;]}],[0,{&quot;name&quot;:[0,&quot;attemptCount&quot;],&quot;type&quot;:[0,&quot;Integer&qu ment-shipping.fulfillment-ready-to-ship-event-v1&quot;],&quot;version&quot;:[0,&quot;latest&quot;],&quot;to&quot;:[1,[[0,{&quot;id&quot;:[0,&quot;fulfillment.shipping.fulfillment-shipping.fulfillment-ready-to-ship-event-v1&quot;],&quot;version&quot;:[0,&quot;latest&quot;],&quot;delivery_mode&quot;:[0,&quot;push&quot;]}]]]}]]],&quot;entities&quot;:[1,[[0,{&quot;id&quot;:[0,&quot;fulfillment.shipping.fulfillment-shipping.fulfillment&quot;],&quot;version&quot;:[0,&quot;0.0.1&quot;]}]]],&quot;id&quot;:[0,&quot;fulfillment.shipping.fulfillment-shipping&quot;],&quot;name&quot;:[0,&quot;Fulfillment Shipping&quot;],&quot;summary&quot;:[0,&quot;Owns scheduling and readiness of shipping operations after an order is confirmed&quot;],&quot;version&quot;:[0,&quot;0.0.1&quot;],&quot;specifications&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;asyncapi&quot;],&quot;path&quot;:[0,&quot;https://github.com/arcadia-editions/fulfillment-shipping-api/raw/main/asyncapi.yml&quot;]}],[0,{&quot;type&quot;:[0,&quot;openapi&quot;],&quot;path&quot;:[0,&quot;https://github.com/arcadia-editions/fulfillment-shipping-api/raw/main/openapi.yml&quot;]}]]]}],&quot;body&quot;:[0,&quot;## OverviewOwns scheduling and readiness of shipping operations after an order is confirmed&lt;NodeGraph /&gt;## Message Flow\n\n&lt;MessageTable format=\&quot;all\&quot; limit={8} showChannels={true} /&gt;## Domain Model\n\n&lt;EntityMap /&gt;## Specifications\n\nThe linked specifications in the frontmatter drive EventCatalog reference views for this service.# Fulfillment Shipping\n\n## Description\n\nFulfillment Shipping is the bounded context that owns the operational step after\nan order is commercially confirmed. It schedules fulfillment, decides whether\nshipping can proceed, and moves the order toward physical delivery readiness.\n\nIt represents the operational side of the flow after the commercial sale has\nalready been confirmed.\n\n## Scope\n\n- Schedule fulfillment after an order is confirmed\n- Hold shipping address and item-level fulfillment data needed for execution\n- Decide whether the shipment is ready to proceed or has failed\n- Publish shipping outcomes used by payment capture and downstream operations\n\n## Main domain elements\n\n- &amp;#x60;Fulfillment&amp;#x60;: aggregate for shipment scheduling and readiness\n- &amp;#x60;FulfillmentShippingService&amp;#x60;: commands for scheduling and preparing shipments\n- &amp;#x60;FulfillmentScheduled&amp;#x60;: event announcing shipping work has been scheduled\n- &amp;#x60;FulfillmentFailed&amp;#x60;: event announcing fulfillment could not proceed\n- &amp;#x60;FulfillmentReadyToShip&amp;#x60;: event announcing the order is ready for shipment\n# Fulfillment Shipping\n\n## Overview\n\nFulfillment Shipping provides the operational shipping perspective within Arcadia Editions. Its purpose is to turn a commercially ready order into work that can be handled reliably by fulfillment operations. The service records and governs the business state needed to prepare a shipment, allowing that work to progress in a clear and auditable way from initial scheduling through delivery readiness or an operational exception.\n\nThis catalog page explains the business meaning of the service&amp;#x27;s published outcomes. It is intended for product, operations, and delivery teams who need a durable understanding of what Fulfillment Shipping represents. The detailed contracts, schemas, and integration artifacts remain the source of truth for technical implementation; this page focuses on the stable business language that gives those artifacts context.\n\nFulfillment Shipping treats shipping as an operational commitment rather than a simple status label. It makes the preparation of a physical delivery visible as a managed business capability, so that fulfillment activity can be planned, assessed, and followed consistently. The service supports a shared understanding of whether shipping work has been accepted, whether it can move forward, and whether it needs attention.\n\n## Domain context\n\nThe Fulfillment domain covers the operational handling that follows a completed commercial decision. Within that domain, Shipping is concerned with the preparation and readiness of goods for physical movement. Its focus is practical execution: ensuring that shipping work has enough business context to be organized, assessed, and represented as a meaningful operational outcome.\n\nShipping readiness is not assumed to be automatic. It depends on the ability to organize fulfillment work and to determine whether the shipment can proceed under the service&amp;#x27;s business rules. By expressing that assessment as part of the domain, Fulfillment Shipping creates a dependable record of operational progress without conflating it with commercial, payment, or customer-communication concerns.\n\n## Responsibilities\n\nFulfillment Shipping owns the business representation of shipment preparation. It establishes when fulfillment work has been scheduled, maintains the information required for that work, and evaluates whether the shipment is ready to continue. It also represents circumstances in which preparation cannot proceed as expected, preserving a clear operational outcome rather than leaving work in an ambiguous state.\n\nThe service provides a consistent lifecycle for shipping work. That lifecycle supports planning and follow-up by distinguishing work that is newly scheduled from work that is ready for the next operational stage, while making failure conditions explicit. These outcomes offer a stable vocabulary for people and systems that need to understand fulfillment progress at a business level.\n\n## Boundaries\n\nFulfillment Shipping is bounded by shipment scheduling and readiness. It does not own the commercial definition of an order, the financial treatment of a purchase, the maintenance of product information, or the delivery of customer communications. It also does not prescribe warehouse procedures, carrier-specific processes, route optimization, or the technical mechanics used to exchange information.\n\nIts responsibility begins when shipping work needs to be represented and ends with a business-level readiness or failure outcome. Detailed operational execution may evolve over time, but the service maintains the durable distinction between work that can proceed and work that requires resolution. This boundary helps keep the fulfillment model focused, comprehensible, and adaptable.\n\n## Business value\n\nBy making shipment preparation explicit, Fulfillment Shipping gives operations a dependable way to understand progress toward physical delivery. Teams can reason about shipping work through shared business outcomes instead of inferring its state from scattered operational activity. This improves visibility, supports timely exception handling, and makes fulfillment performance easier to discuss in a consistent language.\n2026-05-21\n\n- added &amp;#x60;README.md&amp;#x60; describing Fulfillment Shipping as a bounded context\n- added &amp;#x60;SUMMARY.md&amp;#x60; with the business-purpose summary for event catalog generation\n- added this &amp;#x60;CHANGE.log&amp;#x60; to track documentation updates\n- added &amp;#x60;EVENT_CATALOG.md&amp;#x60; with publication-ready Fulfillment Shipping catalog content&quot;],&quot;filePath&quot;:[0,&quot;../domains/fulfillment/subdomains/fulfillment.shipping/services/fulfillment.shipping.fulfillment-shipping/index.mdx&quot;],&quot;digest&quot;:[0,&quot;411467aff864c7c4&quot;],&quot;deferredRender&quot;:[0,true],&quot;collection&quot;:[0,&quot;services&quot;]}]]],&quot;entities&quot;:[1,[[0,{&quot;id&quot;:[0,&quot;fulfillment.shipping.fulfillment-shipping.fulfillment-0.0.1&quot;],&quot;data&quot;:[0,{&quot;aggregateRoot&quot;:[0,true],&quot;identifier&quot;:[0,&quot;fulfillmentId&quot;],&quot;properties&quot;:[1,[[0,{&quot;name&quot;:[0,&quot;fulfillmentId&quot;],&quot;type&quot;:[0,&quot;String&quot;],&quot;required&quot;:[0,true]}],[0,{&quot;
