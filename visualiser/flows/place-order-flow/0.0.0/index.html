      (function () {

        function getEmbeddedTheme() {

          const requestedTheme = params.get('theme');
          const embedded = params.get('embed') === 'true';

 *
 * Covers the full lifecycle of a customer order during a limited edition drop,
 * from the moment the customer submits their intent through payment capture and
 * shipping confirmation — or cancellation if any step fails.
 *
 * Stock reservation happens before payment. In a scarcity-driven drop, inventory
 * is the binding constraint. We hold the item first and charge second.
 *
 * Payment runs in two phases. Authorization at checkout places a hold on the
 * customer's funds without moving money. Capture happens later, at fulfillment
 * time, when the order is physically ready to ship. If fulfillment fails after
 * authorization but before capture, the hold is voided — no charge ever appears
 * on the customer's statement.
 *
 * Transient payment errors are retried within the reservation window. A hard
 * decline from the processor is not retried — it goes straight to cancellation.
 *
 * Reservation expiry is owned by the Scheduler, not the payment service. If
 * payment is not resolved within ten minutes of the order being created, the
 * Scheduler fires ReservationExpired and the stock is returned to the pool."><meta name="robots" content="index, follow"><meta property="og:title" content="Visualiser | Place Order Flow (flows) | Arcadia Editions Event Catalog"><meta property="og:type" content="website"><meta property="og:image" content="https://arcadia-editions.github.io/arcadia-event-catalog/_astro/opengraph.L5gHdVBc.png"><meta property="og:url" content="https://arcadia-editions.github.io/arcadia-event-catalog/"><meta property="og:image:url" content="https://arcadia-editions.github.io/arcadia-event-catalog/_astro/opengraph.L5gHdVBc.png"><meta property="og:image:secure_url" content="https://arcadia-editions.github.io/arcadia-event-catalog/_astro/opengraph.L5gHdVBc.png"><meta property="og:image:alt" content="Visualiser | Place Order Flow (flows) | Arcadia Editions Event Catalog"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Visualiser | Place Order Flow (flows) | Arcadia Editions Event Catalog"><meta name="twitter:image" content="https://arcadia-editions.github.io/arcadia-event-catalog/_astro/opengraph.L5gHdVBc.png"><meta name="twitter:image:alt" content="Visualiser | Place Order Flow (flows) | Arcadia Editions Event Catalog"><meta name="twitter:description" content="Place Order Flow

  @keyframes ec-chat-breathe {
    0%, 100% { transform: scale(1); opacity: .7; }
    50% { transform: scale(1.06); opacity: 1; }
  }
  .ec-chat-surface { font-weight: 400; }
  .ec-chat-avatar { background: rgb(var(--ec-accent) / .06); animation: ec-chat-breathe 5s ease-in-out infinite; }
  /* The closed panel stays on the page (off screen): a running animation there still costs every frame */
  .ec-chat-surface[aria-hidden='true'] .ec-chat-avatar { animation-play-state: paused; }
  .ec-chat-suggestion { width: fit-content; max-width: 100%; transition: background 180ms, transform 180ms; }
  .ec-chat-suggestion:hover { transform: translateX(3px); }
  .ec-chat-message { animation: fadeInUp 280ms ease-out both; }
  .ec-chat-offline > * { animation: fadeInUp 350ms ease-out both; }
  .ec-chat-offline > :nth-child(2) { animation-delay: 100ms; }
  .ec-chat-offline > :nth-child(3) { animation-delay: 220ms; }
  .ec-chat-offline > :nth-child(4) { animation-delay: 340ms; }
  /* What the assistant's doing while it works: a card with a sheen passing over it, its steps so far ticked and the
     one it's on spinning, its words shimmering */
  @keyframes ec-chat-sheen {
    from { background-position: 200% 0; }
    to { background-position: -200% 0; }
  }
  @keyframes ec-chat-spin { to { transform: rotate(360deg); } }
  .ec-chat-activity {
    position: relative;
    overflow: hidden;
    border: 1px solid rgb(var(--ec-accent) / .18);
    border-radius: 14px;
    background: rgb(var(--ec-accent) / .03);
    box-shadow: 0 6px 20px rgb(var(--ec-accent) / .05);
  }
  .ec-chat-activity::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(110deg, transparent 30%, rgb(var(--ec-accent) / .09) 50%, transparent 70%);
    background-size: 200% 100%;
    animation: ec-chat-sheen 2.2s linear infinite;
  }
  .ec-chat-activity-now {
    background: linear-gradient(90deg, rgb(var(--ec-page-text)) 0%, rgb(var(--ec-accent)) 50%, rgb(var(--ec-page-text)) 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: ec-chat-sheen 2.4s linear infinite;
  }
  .ec-chat-spinner {
    width: 12px;
    height: 12px;
    flex: none;
    border-radius: 50%;
    border: 1.5px solid rgb(var(--ec-accent) / .2);
    border-top-color: rgb(var(--ec-accent));
    animation: ec-chat-spin .8s linear infinite;
  }
  /* Follow-up questions on their way: pills like theirs, a sheen passing along them */
  .ec-chat-pending-pill {
    height: 30px;
    border-radius: 999px;
    background: linear-gradient(90deg, rgb(var(--ec-accent) / .05) 25%, rgb(var(--ec-accent) / .14) 50%, rgb(var(--ec-accent) / .05) 75%);
    background-size: 200% 100%;
    animation: fadeInUp 300ms ease-out both, ec-chat-sheen 1.6s linear infinite;
  }
  .ec-chat-surface[aria-hidden='true'] .ec-chat-activity,
  .ec-chat-surface[aria-hidden='true'] .ec-chat-activity *,
  .ec-chat-surface[aria-hidden='true'] .ec-chat-pending-pill { animation-play-state: paused; }
  .ec-chat-composer {
    border-radius: 20px;
    border-color: rgb(var(--ec-accent) / .22);
    background: rgb(var(--ec-page-bg));
    box-shadow: 0 0 0 3px rgb(var(--ec-accent) / .04), 0 8px 28px rgb(var(--ec-accent) / .04);
    transition: border-color 200ms, box-shadow 200ms;
  }
  .ec-chat-composer:focus-within { border-color: rgb(var(--ec-accent) / .5); box-shadow: 0 0 0 3px rgb(var(--ec-accent) / .09); }
  /* What's typed grows the box (up to a point, then scrolls), with what it's based on and Send in a row under it */
  .ec-chat-composer textarea { display: block; resize: none; min-height: 58px; max-height: 200px; overflow-y: auto; padding: 14px 16px 4px; border-radius: 20px 20px 0 0; }
  .ec-chat-composer-footer { display: flex; align-items: center; gap: 8px; padding: 2px 8px 8px 16px; }
  @media (prefers-reduced-motion: reduce) {
    .ec-chat-surface, .ec-chat-surface *, #eventcatalog-header, #eventcatalog-application {
      animation: none !important;
      transition: none !important;
      scroll-behavior: auto !important;
    }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(8px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  @keyframes focusIn {
    from {
      box-shadow: 0 0 0 0 rgba(168, 85, 247, 0);
      border-color: #e5e7eb;
    }
    to {
      box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.15);
      border-color: #c084fc;
    }
  }
  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 8px rgba(147, 51, 234, 0.3); }
    50% { box-shadow: 0 0 16px rgba(147, 51, 234, 0.5); }
  }
