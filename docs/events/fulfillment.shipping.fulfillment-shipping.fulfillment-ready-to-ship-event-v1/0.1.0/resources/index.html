  @keyframes ec-chat-breathe {
    0%, 100% { transform: scale(1); opacity: .7; }
    50% { transform: scale(1.06); opacity: 1; }
  }
  .ec-chat-surface { font-weight: 400; }
  .ec-chat-avatar { background: rgb(var(--ec-accent) / .06); animation: ec-chat-breathe 5s ease-in-out infinite; }
  /* The closed panel stays on the page (off screen): a running animation there still costs every frame */
  .ec-chat-surface[aria-hidden='true'] .ec-chat-avatar { animation-play-state: paused; }
  .ec-chat-suggestion { width: fit-content; max-width: 100%; transition: background 180ms, transform 180ms; }
  .ec-chat-suggestion:hover { transform: translateX(3px); }
  .ec-chat-message { animation: fadeInUp 280ms ease-out both; }
  .ec-chat-offline > * { animation: fadeInUp 350ms ease-out both; }
  .ec-chat-offline > :nth-child(2) { animation-delay: 100ms; }
  .ec-chat-offline > :nth-child(3) { animation-delay: 220ms; }
  .ec-chat-offline > :nth-child(4) { animation-delay: 340ms; }
  /* What the assistant's doing while it works: a card with a sheen passing over it, its steps so far ticked and the
     one it's on spinning, its words shimmering */
  @keyframes ec-chat-sheen {
    from { background-position: 200% 0; }
    to { background-position: -200% 0; }
  }
  @keyframes ec-chat-spin { to { transform: rotate(360deg); } }
  .ec-chat-activity {
    position: relative;
    overflow: hidden;
    border: 1px solid rgb(var(--ec-accent) / .18);
    border-radius: 14px;
    background: rgb(var(--ec-accent) / .03);
    box-shadow: 0 6px 20px rgb(var(--ec-accent) / .05);
  }
  .ec-chat-activity::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(110deg, transparent 30%, rgb(var(--ec-accent) / .09) 50%, transparent 70%);
    background-size: 200% 100%;
    animation: ec-chat-sheen 2.2s linear infinite;
  }
  .ec-chat-activity-now {
    background: linear-gradient(90deg, rgb(var(--ec-page-text)) 0%, rgb(var(--ec-accent)) 50%, rgb(var(--ec-page-text)) 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: ec-chat-sheen 2.4s linear infinite;
  }
  .ec-chat-spinner {
    width: 12px;
    height: 12px;
    flex: none;
    border-radius: 50%;
    border: 1.5px solid rgb(var(--ec-accent) / .2);
    border-top-color: rgb(var(--ec-accent));
    animation: ec-chat-spin .8s linear infinite;
  }
  /* Follow-up questions on their way: pills like theirs, a sheen passing along them */
  .ec-chat-pending-pill {
    height: 30px;
    border-radius: 999px;
    background: linear-gradient(90deg, rgb(var(--ec-accent) / .05) 25%, rgb(var(--ec-accent) / .14) 50%, rgb(var(--ec-accent) / .05) 75%);
    background-size: 200% 100%;
    animation: fadeInUp 300ms ease-out both, ec-chat-sheen 1.6s linear infinite;
  }
  .ec-chat-surface[aria-hidden='true'] .ec-chat-activity,
  .ec-chat-surface[aria-hidden='true'] .ec-chat-activity *,
  .ec-chat-surface[aria-hidden='true'] .ec-chat-pending-pill { animation-play-state: paused; }
  .ec-chat-composer {
    border-radius: 20px;
    border-color: rgb(var(--ec-accent) / .22);
    background: rgb(var(--ec-page-bg));
    box-shadow: 0 0 0 3px rgb(var(--ec-accent) / .04), 0 8px 28px rgb(var(--ec-accent) / .04);
    transition: border-color 200ms, box-shadow 200ms;
  }
  .ec-chat-composer:focus-within { border-color: rgb(var(--ec-accent) / .5); box-shadow: 0 0 0 3px rgb(var(--ec-accent) / .09); }
  /* What's typed grows the box (up to a point, then scrolls), with what it's based on and Send in a row under it */
  .ec-chat-composer textarea { display: block; resize: none; min-height: 58px; max-height: 200px; overflow-y: auto; padding: 14px 16px 4px; border-radius: 20px 20px 0 0; }
  .ec-chat-composer-footer { display: flex; align-items: center; gap: 8px; padding: 2px 8px 8px 16px; }
  @media (prefers-reduced-motion: reduce) {
    .ec-chat-surface, .ec-chat-surface *, #eventcatalog-header, #eventcatalog-application {
      animation: none !important;
      transition: none !important;
      scroll-behavior: auto !important;

        return pathname === match || pathname.startsWith(match);
      });
    }

    if (item?.href) {
      if (/^https?:\/\//.test(item.href)) return false;

      const targetPath = new URL(item.href, window.location.origin).pathname;
      return pathname === targetPath;
    }

    return false;
  };

  const syncNavItemStates = () => {
    const pathname = window.location.pathname;
    const navItems = document.querySelectorAll('[data-role="vertical-nav-item"]');

    navItems.forEach((item) => {
      const id = item.getAttribute('id');
      const navigationItem = clientNavigationItems.find((navItem) => navItem.id === id);
      const isCurrent = navigationItem ? isNavItemCurrent(navigationItem, pathname) : false;

      if (isCurrent) {
        item.classList.remove(...INACTIVE_NAV_CLASSES);
        item.classList.add(...ACTIVE_NAV_CLASSES);
      } else {
        item.classList.remove(...ACTIVE_NAV_CLASSES);
        item.classList.add(...INACTIVE_NAV_CLASSES);
      }
    });
  };

  const routeShouldAutoCollapseVerticalNav = (pathname) =>
    verticalNavAutoCollapsePaths.some((path) => pathname === path || pathname.startsWith(`${path}/`));

  const persistVerticalNavCollapsedState = (collapsed) => {
    try {
      localStorage.setItem(VERTICAL_NAV_STORAGE_KEY, String(collapsed));
    } catch (error) {}
  };

  const getPersistedVerticalNavCollapsedState = () => {
    if (routeShouldAutoCollapseVerticalNav(window.location.pathname)) {
      persistVerticalNavCollapsedState(true);
      return true;
    }

    try {
      const savedState = localStorage.getItem(VERTICAL_NAV_STORAGE_KEY);
      return savedState === null ? true : savedState === 'true';
    } catch (error) {
      return true;
    }
  };

  const applyPersistedVerticalNavState = () => {
    const isCollapsed = getPersistedVerticalNavCollapsedState();
    document.documentElement.setAttribute('data-vertical-nav-collapsed', isCollapsed ? 'true' : 'false');

    const verticalNavRail = document.getElementById('vertical-nav-rail');
    if (verticalNavRail) {
      verticalNavRail.setAttribute('data-collapsed', isCollapsed ? 'true' : 'false');
    }
  };

  const clampSidebarWidth = (width) => Math.min(MAXIMUM_SIDEBAR_WIDTH, Math.max(MINIMUM_SIDEBAR_WIDTH, width));

  const applySidebarWidth = (width) => {
    const nextWidth = clampSidebarWidth(width);
    document.documentElement.style.setProperty('--ec-sidebar-panel-width', `${nextWidth}px`);

    const resizeHandle = document.getElementById('sidebar-resize-handle');
    resizeHandle?.setAttribute('aria-valuenow', String(Math.round(nextWidth)));
    return nextWidth;
  };

  const persistSidebarWidth = (width) => {
    try {
      localStorage.setItem(SIDEBAR_WIDTH_STORAGE_KEY, String(Math.round(width)));
    } catch (error) {}
  };

  const getPersistedSidebarWidth = () => {
    try {
      const savedWidth = Number(localStorage.getItem(SIDEBAR_WIDTH_STORAGE_KEY));
      return Number.isFinite(savedWidth) && savedWidth > 0 ? clampSidebarWidth(savedWidth) : null;
    } catch (error) {
      return null;
    }
  };

  const setupSidebarResize = () => {
    const sidebar = document.getElementById('sidebar');
    const resizeHandle = document.getElementById('sidebar-resize-handle');
    if (!sidebar || !resizeHandle) return;

    const persistedWidth = getPersistedSidebarWidth();
    const currentWidth = persistedWidth ?? sidebar.getBoundingClientRect().width;
    applySidebarWidth(currentWidth);

    resizeHandle.onpointerdown = (event) => {
      if (event.button !== 0) return;

      const startX = event.clientX;
      const startWidth = sidebar.getBoundingClientRect().width;
      document.body.classList.add('sidebar-is-resizing');
      resizeHandle.setPointerCapture(event.pointerId);

      resizeHandle.onpointermove = (moveEvent) => {
        applySidebarWidth(startWidth + moveEvent.clientX - startX);
      };

      const finishResize = (upEvent) => {
        const finalWidth = applySidebarWidth(startWidth + upEvent.clientX - startX);
        persistSidebarWidth(finalWidth);
        document.body.classList.remove('sidebar-is-resizing');
        if (resizeHandle.hasPointerCapture(upEvent.pointerId)) {
          resizeHandle.releasePointerCapture(upEvent.pointerId);
        }
        resizeHandle.onpointermove = null;
        resizeHandle.onpointerup = null;
        resizeHandle.onpointercancel = null;
      };

      resizeHandle.onpointerup = finishResize;
      resizeHandle.onpointercancel = finishResize;
    };

    resizeHandle.onkeydown = (event) => {
      if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;

      event.preventDefault();
      const direction = event.key === 'ArrowLeft' ? -1 : 1;
      const step = event.shiftKey ? 32 : 16;
      const nextWidth = applySidebarWidth(sidebar.getBoundingClientRect().width + direction * step);
      persistSidebarWidth(nextWidth);
    };
  };

  // Apply immediately when this script executes so transitions don't briefly re-open the rail.
  applyPersistedVerticalNavState();

  // Re-apply around Astro view transitions because the incoming document can momentarily drop the root attribute.
  document.addEventListener('astro:before-preparation', applyPersistedVerticalNavState);
  document.addEventListener('astro:after-swap', applyPersistedVerticalNavState);

  // Listen for Astro transititions
  document.addEventListener('astro:page-load', () => {
    applyPersistedVerticalNavState();
    document.dispatchEvent(new CustomEvent('contentLoaded'));
  });

  // Listen for DOM loaded
  document.addEventListener('DOMContentLoaded', () => {
    applyPersistedVerticalNavState();
    document.dispatchEvent(new CustomEvent('contentLoaded'));
  });

  document.addEventListener('contentLoaded', () => {
    // Users can add ?embed=true to the URL to hide the navigation
    const urlSearchParams = new URLSearchParams(window.location.search);
    const params = Object.fromEntries(urlSearchParams.entries());
    const embeded = params.embed === 'true' ? true : false;
    document.documentElement.setAttribute('data-embedded', embeded ? 'true' : 'false');
    const content = document.getElementById('content');
    const shell = document.querySelector('.app-shell');
    const app = document.getElementById('eventcatalog-application');
    const verticalNavRail = document.getElementById('vertical-nav-rail');
    const verticalNavToggle = document.getElementById('vertical-nav-toggle');
    const navToggleLabel = verticalNavToggle?.querySelector('.nav-label');
    const collapseIcon = verticalNavToggle?.querySelector('.nav-collapse-icon');

    const setVerticalNavCollapsedState = (collapsed) => {
      if (!app || !verticalNavRail || !verticalNavToggle || !navToggleLabel) return;
      const railTextElements = verticalNavRail.querySelectorAll(
        '.nav-brand-text, .nav-item-label, .rail-section-label, .nav-count-pill, .nav-label'
      );

      document.documentElement.setAttribute('data-vertical-nav-collapsed', collapsed ? 'true' : 'false');
      verticalNavRail.setAttribute('data-collapsed', collapsed ? 'true' : 'false');
      verticalNavToggle.setAttribute('aria-label', collapsed ? 'Expand sidebar' : 'Collapse sidebar');
      verticalNavToggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
      navToggleLabel.textContent = collapsed ? 'Expand' : 'Collapse';
      railTextElements.forEach((element) => {
        if (collapsed) {
          element.setAttribute('hidden', '');
        } else {
          element.removeAttribute('hidden');
        }
      });

      if (collapseIcon) {
        collapseIcon.setAttribute('title', collapsed ? 'Expand sidebar' : 'Collapse sidebar');
      }
    };

    if (embeded) {
      const elementsToHide = [
        'eventcatalog-vertical-nav',
        'eventcatalog-header',
        'eventcatalog-header-spacer',
        'sidebar',
        'visualiser-footer',
        // /discover page elements
        'discover-collection-tabs',
        'discover-title',
      ];

      elementsToHide.forEach((id) => {
        const element = document.getElementById(id);
        if (element) element.style.display = 'none';
      });

      document.body.style.overflow = '';
      app.style.overflow = '';
      if (shell) shell.style.marginLeft = '0';
      return;
    }

    if (shell) {
      shell.style.marginLeft = '';
    }

    setVerticalNavCollapsedState(getPersistedVerticalNavCollapsedState());
    setupSidebarResize();

    syncNavItemStates();

    if (verticalNavToggle) {
      verticalNavToggle.onclick = () => {
        const isCollapsed = verticalNavRail?.getAttribute('data-collapsed') === 'true';
        const nextState = !isCollapsed;

        setVerticalNavCollapsedState(nextState);
        persistVerticalNavCollapsedState(nextState);
      };
    }
  });
})();</script>
