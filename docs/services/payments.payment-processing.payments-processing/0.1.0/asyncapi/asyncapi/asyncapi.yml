asyncapi: 3.1.0
id: urn:com.arcadiaeditions:payments:processing:asyncapi

info:
  title: Arcadia Editions - Payments Processing
  version: "0.1.0"
  tags:
  - name: Default
  - name: PaymentsProcessing

servers:
  develop:
    $ref: https://raw.githubusercontent.com/arcadia-editions/api-contract-commons/refs/heads/main/asyncapi-master.yml#/servers/develop

x-application-bindings:
  x-principal: payments_processing
  x-clientId: payments_processing
  x-groupId: payments_processing

defaultContentType: application/json

channels:
  payment-retried-event-v1:
    address: payments-processing.payment-retried.event.avro.v1
    messages:
      AuthorizePaymentInputCommand:
        $ref: "#/components/messages/AuthorizePaymentInputCommand"
      PaymentRetriedResponse:
        $ref: "#/components/messages/PaymentRetriedResponse"
    x-traits:
    - $ref: https://raw.githubusercontent.com/arcadia-editions/api-contract-commons/refs/heads/main/asyncapi-channel-traits.yml#/components/channelTraits/kafkaTopicS
    - $ref: https://raw.githubusercontent.com/arcadia-editions/api-contract-commons/refs/heads/main/asyncapi-channel-traits.yml#/components/channelTraits/kafkaTopicRetained
    x-visibility: global
  payment-failed-event-v1:
    address: payments-processing.payment-failed.event.avro.v1
    messages:
      RetryPaymentInputCommand:
        $ref: "#/components/messages/RetryPaymentInputCommand"
      PaymentFailedResponse:
        $ref: "#/components/messages/PaymentFailedResponse"
    x-traits:
    - $ref: https://raw.githubusercontent.com/arcadia-editions/api-contract-commons/refs/heads/main/asyncapi-channel-traits.yml#/components/channelTraits/kafkaTopicS
    - $ref: https://raw.githubusercontent.com/arcadia-editions/api-contract-commons/refs/heads/main/asyncapi-channel-traits.yml#/components/channelTraits/kafkaTopicRetained
    x-visibility: global
  payment-capture-failed-event-v1:
    address: payments-processing.payment-capture-failed.event.avro.v1
    messages:
      VoidPaymentInputCommand:
        $ref: "#/components/messages/VoidPaymentInputCommand"
      PaymentCaptureFailedEvent:
        $ref: "#/components/messages/PaymentCaptureFailedEvent"
    x-traits:
    - $ref: https://raw.githubusercontent.com/arcadia-editions/api-contract-commons/refs/heads/main/asyncapi-channel-traits.yml#/components/channelTraits/kafkaTopicS
    - $ref: https://raw.githubusercontent.com/arcadia-editions/api-contract-commons/refs/heads/main/asyncapi-channel-traits.yml#/components/channelTraits/kafkaTopicRetained
    x-visibility: global
  payment-authorized-event-v1:
    address: payments-processing.payment-authorized.event.avro.v1
    messages:
      PaymentAuthorizedResponse:
        $ref: "#/components/messages/PaymentAuthorizedResponse"
    x-traits:
    - $ref: https://raw.githubusercontent.com/arcadia-editions/api-contract-commons/refs/heads/main/asyncapi-channel-traits.yml#/components/channelTraits/kafkaTopicS
    - $ref: https://raw.githubusercontent.com/arcadia-editions/api-contract-commons/refs/heads/main/asyncapi-channel-traits.yml#/components/channelTraits/kafkaTopicRetained
    x-visibility: global
  payment-declined-event-v1:
    address: payments-processing.payment-declined.event.avro.v1
    messages:
      PaymentDeclinedResponse:
        $ref: "#/components/messages/PaymentDeclinedResponse"
    x-traits:
    - $ref: https://raw.githubusercontent.com/arcadia-editions/api-contract-commons/refs/heads/main/asyncapi-channel-traits.yml#/components/channelTraits/kafkaTopicS
    - $ref: https://raw.githubusercontent.com/arcadia-editions/api-contract-commons/refs/heads/main/asyncapi-channel-traits.yml#/components/channelTraits/kafkaTopicRetained
    x-visibility: global
  payment-retry-exhausted-event-v1:
    address: payments-processing.payment-retry-exhausted.event.avro.v1
    messages:
      PaymentRetryExhaustedResponse:
        $ref: "#/components/messages/PaymentRetryExhaustedResponse"
    x-traits:
    - $ref: https://raw.githubusercontent.com/arcadia-editions/api-contract-commons/refs/heads/main/asyncapi-channel-traits.yml#/components/channelTraits/kafkaTopicS
    - $ref: https://raw.githubusercontent.com/arcadia-editions/api-contract-commons/refs/heads/main/asyncapi-channel-traits.yml#/components/channelTraits/kafkaTopicRetained
    x-visibility: global
  payment-captured-event-v1:
    address: payments-processing.payment-captured.event.avro.v1
    messages:
      PaymentCapturedEvent:
        $ref: "#/components/messages/PaymentCapturedEvent"
    x-traits:
    - $ref: https://raw.githubusercontent.com/arcadia-editions/api-contract-commons/refs/heads/main/asyncapi-channel-traits.yml#/components/channelTraits/kafkaTopicS
    - $ref: https://raw.githubusercontent.com/arcadia-editions/api-contract-commons/refs/heads/main/asyncapi-channel-traits.yml#/components/channelTraits/kafkaTopicRetained
    x-visibility: global
  payment-voided-event-v1:
    address: payments-processing.payment-voided.event.avro.v1
    messages:
      PaymentVoidedResponse:
        $ref: "#/components/messages/PaymentVoidedResponse"
    x-traits:
    - $ref: https://raw.githubusercontent.com/arcadia-editions/api-contract-commons/refs/heads/main/asyncapi-channel-traits.yml#/components/channelTraits/kafkaTopicS
    - $ref: https://raw.githubusercontent.com/arcadia-editions/api-contract-commons/refs/heads/main/asyncapi-channel-traits.yml#/components/channelTraits/kafkaTopicRetained
    x-visibility: global

operations:
  doAuthorizePayment:
    action: receive
    tags:
    - name: PaymentsProcessing
    channel:
      $ref: "#/channels/payment-retried-event-v1"
    traits:
    - $ref: "#/components/operationTraits/clientIdAndPrincipal"
  doRetryPayment:
    action: receive
    tags:
    - name: PaymentsProcessing
    channel:
      $ref: "#/channels/payment-failed-event-v1"
    traits:
    - $ref: "#/components/operationTraits/clientIdAndPrincipal"
  doVoidPayment:
    action: receive
    tags:
    - name: PaymentsProcessing
    channel:
      $ref: "#/channels/payment-capture-failed-event-v1"
    traits:
    - $ref: "#/components/operationTraits/clientIdAndPrincipal"
  onPaymentAuthorized:
    action: send
    tags:
    - name: PaymentsProcessing
    channel:
      $ref: "#/channels/payment-authorized-event-v1"
    traits:
    - $ref: "#/components/operationTraits/clientIdAndPrincipal"
  onPaymentDeclined:
    action: send
    tags:
    - name: PaymentsProcessing
    channel:
      $ref: "#/channels/payment-declined-event-v1"
    traits:
    - $ref: "#/components/operationTraits/clientIdAndPrincipal"
  onPaymentFailed:
    action: send
    tags:
    - name: PaymentsProcessing
    channel:
      $ref: "#/channels/payment-failed-event-v1"
    traits:
    - $ref: "#/components/operationTraits/clientIdAndPrincipal"
  onPaymentRetried:
    action: send
    tags:
    - name: PaymentsProcessing
    channel:
      $ref: "#/channels/payment-retried-event-v1"
    traits:
    - $ref: "#/components/operationTraits/clientIdAndPrincipal"
  onPaymentRetryExhausted:
    action: send
    tags:
    - name: PaymentsProcessing
    channel:
      $ref: "#/channels/payment-retry-exhausted-event-v1"
    traits:
    - $ref: "#/components/operationTraits/clientIdAndPrincipal"
  onPaymentCaptured:
    action: send
    tags:
    - name: PaymentsProcessing
    channel:
      $ref: "#/channels/payment-captured-event-v1"
    traits:
    - $ref: "#/components/operationTraits/clientIdAndPrincipal"
  onPaymentCaptureFailed:
    action: send
    tags:
    - name: PaymentsProcessing
    channel:
      $ref: "#/channels/payment-capture-failed-event-v1"
    traits:
    - $ref: "#/components/operationTraits/clientIdAndPrincipal"
  onPaymentVoided:
    action: send
    tags:
    - name: PaymentsProcessing
    channel:
      $ref: "#/channels/payment-voided-event-v1"
    traits:
    - $ref: "#/components/operationTraits/clientIdAndPrincipal"

components:
  messages:
    AuthorizePaymentInputCommand:
      name: AuthorizePaymentInputCommand
      title: ""
      summary: ""
      traits:
      - $ref: "#/components/messageTraits/CommonHeaders"
      payload:
        schemaFormat: application/vnd.apache.avro+json;version=1.9.0
        schema:
          $ref: avro/AuthorizePaymentInput.avsc
    RetryPaymentInputCommand:
      name: RetryPaymentInputCommand
      title: ""
      summary: ""
      traits:
      - $ref: "#/components/messageTraits/CommonHeaders"
      payload:
        schemaFormat: application/vnd.apache.avro+json;version=1.9.0
        schema:
          $ref: avro/RetryPaymentInput.avsc
    VoidPaymentInputCommand:
      name: VoidPaymentInputCommand
      title: The payment is resolved by orderId (Payment.orderId is unique); fulfillment
        events carry no paymentId.
      summary: The payment is resolved by orderId (Payment.orderId is unique); fulfillment
        events carry no paymentId.
      traits:
      - $ref: "#/components/messageTraits/CommonHeaders"
      payload:
        schemaFormat: application/vnd.apache.avro+json;version=1.9.0
        schema:
          $ref: avro/VoidPaymentInput.avsc
    PaymentAuthorizedResponse:
      name: PaymentAuthorizedResponse
      title: ""
      summary: ""
      traits:
      - $ref: "#/components/messageTraits/CommonHeaders"
      payload:
        schemaFormat: application/vnd.apache.avro+json;version=1.9.0
        schema:
          $ref: avro/PaymentAuthorized.avsc
    PaymentDeclinedResponse:
      name: PaymentDeclinedResponse
      title: ""
      summary: ""
      traits:
      - $ref: "#/components/messageTraits/CommonHeaders"
      payload:
        schemaFormat: application/vnd.apache.avro+json;version=1.9.0
        schema:
          $ref: avro/PaymentDeclined.avsc
    PaymentFailedResponse:
      name: PaymentFailedResponse
      title: ""
      summary: ""
      traits:
      - $ref: "#/components/messageTraits/CommonHeaders"
      payload:
        schemaFormat: application/vnd.apache.avro+json;version=1.9.0
        schema:
          $ref: avro/PaymentFailed.avsc
    PaymentRetriedResponse:
      name: PaymentRetriedResponse
      title: ""
      summary: ""
      traits:
      - $ref: "#/components/messageTraits/CommonHeaders"
      payload:
        schemaFormat: application/vnd.apache.avro+json;version=1.9.0
        schema:
          $ref: avro/PaymentRetried.avsc
    PaymentRetryExhaustedResponse:
      name: PaymentRetryExhaustedResponse
      title: ""
      summary: ""
      traits:
      - $ref: "#/components/messageTraits/CommonHeaders"
      payload:
        schemaFormat: application/vnd.apache.avro+json;version=1.9.0
        schema:
          $ref: avro/PaymentRetryExhausted.avsc
    PaymentCapturedEvent:
      name: PaymentCapturedEvent
      title: ""
      summary: ""
      traits:
      - $ref: "#/components/messageTraits/CommonHeaders"
      payload:
        schemaFormat: application/vnd.apache.avro+json;version=1.9.0
        schema:
          $ref: avro/PaymentCaptured.avsc
    PaymentCaptureFailedEvent:
      name: PaymentCaptureFailedEvent
      title: ""
      summary: ""
      traits:
      - $ref: "#/components/messageTraits/CommonHeaders"
      payload:
        schemaFormat: application/vnd.apache.avro+json;version=1.9.0
        schema:
          $ref: avro/PaymentCaptureFailed.avsc
    PaymentVoidedResponse:
      name: PaymentVoidedResponse
      title: ""
      summary: ""
      traits:
      - $ref: "#/components/messageTraits/CommonHeaders"
      payload:
        schemaFormat: application/vnd.apache.avro+json;version=1.9.0
        schema:
          $ref: avro/PaymentVoided.avsc
  messageTraits:
    CommonHeaders:
      $ref: https://raw.githubusercontent.com/arcadia-editions/api-contract-commons/refs/heads/main/asyncapi-message-traits.yml#/components/messageTraits/CommonHeaders
  operationTraits:
    clientIdAndPrincipal:
      bindings:
        kafka:
          x-principal:
            $ref: "#/x-application-bindings/x-principal"
          x-groupId:
            $ref: "#/x-application-bindings/x-groupId"
