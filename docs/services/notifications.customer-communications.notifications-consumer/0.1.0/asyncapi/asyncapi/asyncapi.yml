asyncapi: 3.1.0
id: urn:com.arcadiaeditions:notifications:consumer:asyncapi

info:
  title: Arcadia Editions - Notifications Consumer
  version: "0.1.0"
  tags:
  - name: Default
  - name: NotificationsConsumer

servers:
  develop:
    $ref: https://raw.githubusercontent.com/arcadia-editions/api-contract-commons/refs/heads/main/asyncapi-master.yml#/servers/develop

x-application-bindings:
  x-principal: notifications_consumer
  x-clientId: notifications_consumer
  x-groupId: notifications_consumer

defaultContentType: application/json

channels:
  order-confirmation-sent-event-v1:
    address: notifications-consumer.order-confirmation-sent.event.avro.v1
    messages:
      OrderConfirmationSentEvent:
        $ref: "#/components/messages/OrderConfirmationSentEvent"
    x-traits:
    - $ref: https://raw.githubusercontent.com/arcadia-editions/api-contract-commons/refs/heads/main/asyncapi-channel-traits.yml#/components/channelTraits/kafkaTopicS
    - $ref: https://raw.githubusercontent.com/arcadia-editions/api-contract-commons/refs/heads/main/asyncapi-channel-traits.yml#/components/channelTraits/kafkaTopicRetained
    x-visibility: global
  notification-delivery-failed-event-v1:
    address: notifications-consumer.notification-delivery-failed.event.avro.v1
    messages:
      NotificationDeliveryFailedEvent:
        $ref: "#/components/messages/NotificationDeliveryFailedEvent"
    x-traits:
    - $ref: https://raw.githubusercontent.com/arcadia-editions/api-contract-commons/refs/heads/main/asyncapi-channel-traits.yml#/components/channelTraits/kafkaTopicS
    - $ref: https://raw.githubusercontent.com/arcadia-editions/api-contract-commons/refs/heads/main/asyncapi-channel-traits.yml#/components/channelTraits/kafkaTopicRetained
    x-visibility: global
  stock-unavailable-notification-sent-event-v1:
    address: notifications-consumer.stock-unavailable-notification-sent.event.avro.v1
    messages:
      StockUnavailableNotificationSentEvent:
        $ref: "#/components/messages/StockUnavailableNotificationSentEvent"
    x-traits:
    - $ref: https://raw.githubusercontent.com/arcadia-editions/api-contract-commons/refs/heads/main/asyncapi-channel-traits.yml#/components/channelTraits/kafkaTopicS
    - $ref: https://raw.githubusercontent.com/arcadia-editions/api-contract-commons/refs/heads/main/asyncapi-channel-traits.yml#/components/channelTraits/kafkaTopicRetained
    x-visibility: global
  order-cancelled-notification-sent-event-v1:
    address: notifications-consumer.order-cancelled-notification-sent.event.avro.v1
    messages:
      OrderCancelledNotificationSentEvent:
        $ref: "#/components/messages/OrderCancelledNotificationSentEvent"
    x-traits:
    - $ref: https://raw.githubusercontent.com/arcadia-editions/api-contract-commons/refs/heads/main/asyncapi-channel-traits.yml#/components/channelTraits/kafkaTopicS
    - $ref: https://raw.githubusercontent.com/arcadia-editions/api-contract-commons/refs/heads/main/asyncapi-channel-traits.yml#/components/channelTraits/kafkaTopicRetained
    x-visibility: global

operations:
  onOrderConfirmationSent:
    action: send
    tags:
    - name: NotificationsConsumer
    channel:
      $ref: "#/channels/order-confirmation-sent-event-v1"
    traits:
    - $ref: "#/components/operationTraits/clientIdAndPrincipal"
  onNotificationDeliveryFailed:
    action: send
    tags:
    - name: NotificationsConsumer
    channel:
      $ref: "#/channels/notification-delivery-failed-event-v1"
    traits:
    - $ref: "#/components/operationTraits/clientIdAndPrincipal"
  onStockUnavailableNotificationSent:
    action: send
    tags:
    - name: NotificationsConsumer
    channel:
      $ref: "#/channels/stock-unavailable-notification-sent-event-v1"
    traits:
    - $ref: "#/components/operationTraits/clientIdAndPrincipal"
  onOrderCancelledNotificationSent:
    action: send
    tags:
    - name: NotificationsConsumer
    channel:
      $ref: "#/channels/order-cancelled-notification-sent-event-v1"
    traits:
    - $ref: "#/components/operationTraits/clientIdAndPrincipal"

components:
  messages:
    OrderConfirmationSentEvent:
      name: OrderConfirmationSentEvent
      title: ""
      summary: ""
      traits:
      - $ref: "#/components/messageTraits/CommonHeaders"
      payload:
        schemaFormat: application/vnd.apache.avro+json;version=1.9.0
        schema:
          $ref: avro/OrderConfirmationSent.avsc
    StockUnavailableNotificationSentEvent:
      name: StockUnavailableNotificationSentEvent
      title: ""
      summary: ""
      traits:
      - $ref: "#/components/messageTraits/CommonHeaders"
      payload:
        schemaFormat: application/vnd.apache.avro+json;version=1.9.0
        schema:
          $ref: avro/StockUnavailableNotificationSent.avsc
    OrderCancelledNotificationSentEvent:
      name: OrderCancelledNotificationSentEvent
      title: ""
      summary: ""
      traits:
      - $ref: "#/components/messageTraits/CommonHeaders"
      payload:
        schemaFormat: application/vnd.apache.avro+json;version=1.9.0
        schema:
          $ref: avro/OrderCancelledNotificationSent.avsc
    NotificationDeliveryFailedEvent:
      name: NotificationDeliveryFailedEvent
      title: ""
      summary: ""
      traits:
      - $ref: "#/components/messageTraits/CommonHeaders"
      payload:
        schemaFormat: application/vnd.apache.avro+json;version=1.9.0
        schema:
          $ref: avro/NotificationDeliveryFailed.avsc
  messageTraits:
    CommonHeaders:
      $ref: https://raw.githubusercontent.com/arcadia-editions/api-contract-commons/refs/heads/main/asyncapi-message-traits.yml#/components/messageTraits/CommonHeaders
  operationTraits:
    clientIdAndPrincipal:
      bindings:
        kafka:
          x-principal:
            $ref: "#/x-application-bindings/x-principal"
          x-groupId:
            $ref: "#/x-application-bindings/x-groupId"
