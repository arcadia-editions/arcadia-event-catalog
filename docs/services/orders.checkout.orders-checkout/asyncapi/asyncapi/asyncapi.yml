asyncapi: 3.1.0
id: urn:com.arcadiaeditions:orders:checkout:asyncapi

info:
  title: Arcadia Editions - Orders Checkout
  version: "0.1.0"
  tags:
  - name: Default
  - name: OrdersCheckout

servers:
  develop:
    $ref: https://raw.githubusercontent.com/arcadia-editions/api-contract-commons/refs/heads/main/asyncapi-master.yml#/servers/develop


defaultContentType: application/json

channels:
  order-created-event-v1:
    address: orders-checkout.order-created.event.avro.v1
    x-visibility: global
    messages:
      OrderCreatedEvent:
        $ref: "#/components/messages/OrderCreatedEvent"
    bindings:
      kafka:
        partitions: 3
        replicas: 3
        topicConfiguration:
          cleanup.policy: [ "delete" ]
          retention.ms: 604800000
          retention.bytes: 1000000000
          delete.retention.ms: 86400000
          max.message.bytes: 1048588
        x-env-server-overrides:
          develop:
            partitions: 1
            replicas: 1
            topicConfiguration:
              cleanup.policy: [ "delete" ]
              retention.ms: 604800
          staging:
            partitions: 3
            replicas: 2
            topicConfiguration:
              cleanup.policy: [ "delete" ]
              retention.ms: 604800
  stock-unavailable-event-v1:
    address: orders-checkout.stock-unavailable.event.avro.v1
    x-visibility: global
    messages:
      StockUnavailableEvent:
        $ref: "#/components/messages/StockUnavailableEvent"
    bindings:
      kafka:
        partitions: 3
        replicas: 3
        topicConfiguration:
          cleanup.policy: [ "delete" ]
          retention.ms: 604800000
          retention.bytes: 1000000000
          delete.retention.ms: 86400000
          max.message.bytes: 1048588
        x-env-server-overrides:
          develop:
            partitions: 1
            replicas: 1
            topicConfiguration:
              cleanup.policy: [ "delete" ]
              retention.ms: 604800
          staging:
            partitions: 3
            replicas: 2
            topicConfiguration:
              cleanup.policy: [ "delete" ]
              retention.ms: 604800
  order-confirmed-event-v1:
    address: orders-checkout.order-confirmed.event.avro.v1
    x-visibility: global
    messages:
      OrderConfirmedEvent:
        $ref: "#/components/messages/OrderConfirmedEvent"
    bindings:
      kafka:
        partitions: 3
        replicas: 3
        topicConfiguration:
          cleanup.policy: [ "delete" ]
          retention.ms: 604800000
          retention.bytes: 1000000000
          delete.retention.ms: 86400000
          max.message.bytes: 1048588
        x-env-server-overrides:
          develop:
            partitions: 1
            replicas: 1
            topicConfiguration:
              cleanup.policy: [ "delete" ]
              retention.ms: 604800
          staging:
            partitions: 3
            replicas: 2
            topicConfiguration:
              cleanup.policy: [ "delete" ]
              retention.ms: 604800
  order-cancelled-event-v1:
    address: orders-checkout.order-cancelled.event.avro.v1
    x-visibility: global
    messages:
      OrderCancelledEvent:
        $ref: "#/components/messages/OrderCancelledEvent"
    bindings:
      kafka:
        partitions: 3
        replicas: 3
        topicConfiguration:
          cleanup.policy: [ "delete" ]
          retention.ms: 604800000
          retention.bytes: 1000000000
          delete.retention.ms: 86400000
          max.message.bytes: 1048588
        x-env-server-overrides:
          develop:
            partitions: 1
            replicas: 1
            topicConfiguration:
              cleanup.policy: [ "delete" ]
              retention.ms: 604800
          staging:
            partitions: 3
            replicas: 2
            topicConfiguration:
              cleanup.policy: [ "delete" ]
              retention.ms: 604800

operations:
  onOrderCreated:
    action: send
    tags:
    - name: OrdersCheckout
    channel:
      $ref: "#/channels/order-created-event-v1"
    traits:
    - $ref: "#/components/operationTraits/clientIdAndPrincipal"
  onStockUnavailable:
    action: send
    tags:
    - name: OrdersCheckout
    channel:
      $ref: "#/channels/stock-unavailable-event-v1"
    traits:
    - $ref: "#/components/operationTraits/clientIdAndPrincipal"
  onOrderConfirmed:
    action: send
    tags:
    - name: OrdersCheckout
    channel:
      $ref: "#/channels/order-confirmed-event-v1"
    traits:
    - $ref: "#/components/operationTraits/clientIdAndPrincipal"
  onOrderCancelled:
    action: send
    tags:
    - name: OrdersCheckout
    channel:
      $ref: "#/channels/order-cancelled-event-v1"
    traits:
    - $ref: "#/components/operationTraits/clientIdAndPrincipal"

components:
  messages:
    OrderCreatedEvent:
      name: OrderCreatedEvent
      title: ""
      summary: ""
      traits:
      - $ref: "#/components/messageTraits/CommonHeaders"
      - $ref: "#/components/messageTraits/KafkaSchemaCompatibility"
      payload:
        schemaFormat: application/vnd.apache.avro+json;version=1.9.0
        schema:
          $ref: avro/OrderCreated.avsc
    StockUnavailableEvent:
      name: StockUnavailableEvent
      title: ""
      summary: ""
      traits:
      - $ref: "#/components/messageTraits/CommonHeaders"
      - $ref: "#/components/messageTraits/KafkaSchemaCompatibility"
      payload:
        schemaFormat: application/vnd.apache.avro+json;version=1.9.0
        schema:
          $ref: avro/StockUnavailable.avsc
    OrderConfirmedEvent:
      name: OrderConfirmedEvent
      title: ""
      summary: ""
      traits:
      - $ref: "#/components/messageTraits/CommonHeaders"
      - $ref: "#/components/messageTraits/KafkaSchemaCompatibility"
      payload:
        schemaFormat: application/vnd.apache.avro+json;version=1.9.0
        schema:
          $ref: avro/OrderConfirmed.avsc
    OrderCancelledEvent:
      name: OrderCancelledEvent
      title: ""
      summary: ""
      traits:
      - $ref: "#/components/messageTraits/CommonHeaders"
      - $ref: "#/components/messageTraits/KafkaSchemaCompatibility"
      payload:
        schemaFormat: application/vnd.apache.avro+json;version=1.9.0
        schema:
          $ref: avro/OrderCancelled.avsc

  messageTraits:
    CommonHeaders:
      $ref: https://raw.githubusercontent.com/arcadia-editions/api-contract-commons/refs/heads/main/asyncapi-message-traits.yml#/components/messageTraits/CommonHeaders
    KafkaSchemaCompatibility:
      bindings:
        kafka:
          bindingVersion: '0.5.0'
          schemaIdLocation: 'payload'
          schemaLookupStrategy: 'TopicNameStrategy'
          x-compatibility: 'FORWARD'

  operationTraits:
    clientIdAndPrincipal:
      bindings:
        kafka:
          clientId: { const: orders_checkout}
          groupId: { const: orders_checkout}
          x-principal: orders_checkout
